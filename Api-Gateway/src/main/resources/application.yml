spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: cursos-route
          uri: lb://examen-aplicaciones
          predicates:
            - Path=/api/cursos/**
        - id: profesores-route
          uri: lb://examen-aplicaciones
          predicates:
            - Path=/api/profesores/**

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
